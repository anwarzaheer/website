<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My S25 Ultra World</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #111827,
        #1e293b,
        #0f172a
    );
    font-family:'Trebuchet MS', 'Segoe UI', sans-serif;
    overflow:hidden;
}

/* Animated background glow */
body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#00e5ff55,#00000000);
    top:-100px;
    left:-100px;
    animation:float 6s ease-in-out infinite;
}

body::after{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:radial-gradient(circle,#ff00ff33,#00000000);
    bottom:-100px;
    right:-100px;
    animation:float 8s ease-in-out infinite reverse;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(30px);}
}

.card{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    padding:45px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
    max-width:600px;
}

h1{
    font-size:3rem;
    font-weight:800;
    margin-bottom:20px;
    background:linear-gradient(
        90deg,
        #00e5ff,
        #00ff88,
        #ffee00,
        #ff7b00,
        #ff00ff
    );
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 20px rgba(255,255,255,0.2);
}

p{
    color:#d1d5db;
    font-size:1.2rem;
    margin-bottom:30px;
    letter-spacing:1px;
}

button{
    padding:14px 35px;
    border:none;
    border-radius:50px;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(45deg,#00c6ff,#0072ff,#8a2be2);
    background-size:200% 200%;
    animation:gradientBtn 4s ease infinite;
    box-shadow:0 0 25px rgba(0,198,255,.5);
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px rgba(0,198,255,.9);
}

@keyframes gradientBtn{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
</style>
</head>

<body>

<div class="card">
    <h1>📱 Welcome to My S25 Ultra World</h1>
    <p>Experience innovation, style, and technology in a colourful digital space.</p>

    <button onclick="window.location.href='https://anwarzaheer.wordpress.com'">
        Click Me
    </button>
</div>

</body>
</html>
